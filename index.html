<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timezone Converter</title>
  <link rel="stylesheet" href="style.css">
  <!-- Luxon library for timezone calculations -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
</head>
<body>
  <main class="card">
    <div class="header-row">
      <div>
        <h1>Timezone Converter</h1>
        <p class="subtitle">Convert timestamps to your local time automatically!</p>
      </div>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">
        <!-- SVG Gear Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>

    <div class="input-group">
      <label for="time-input">Enter Timestamp & Timezone</label>
      <div class="input-with-button">
        <input 
          type="text" 
          id="time-input" 
          placeholder="e.g. 9:30 pm PT, 2 AM JST, 14:55 CST" 
          autocomplete="off"
          autofocus
        />
        <button id="paste-btn" type="button" aria-label="Paste from clipboard">
          Paste
        </button>
      </div>
    </div>

    <div id="result-container" class="result-container">
      <span class="label">Local Time</span>
      <div id="converted-time" class="large-time">--:--</div>
      <div id="converted-details" class="details-text">Enter a timestamp above</div>
    </div>
  </main>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="close-modal-btn" class="icon-btn">&times;</button>
      </div>
      <div class="input-group">
        <label for="timezone-search">Target Timezone</label>
        <input type="text" id="timezone-search" placeholder="Search region or city..." autocomplete="off">
        <select id="timezone-select" size="6">
          <!-- Options populated by JS -->
        </select>
        <p class="details-text" style="margin-top: 0.5rem;">Overrides your local browser time.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
